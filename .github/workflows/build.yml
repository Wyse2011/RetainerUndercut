name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud dev assemblies
        shell: pwsh
        run: |
          $dest = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $dest

      - name: Build
        run: dotnet build RetainerUndercut/RetainerUndercut.csproj -c Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: RetainerUndercut
          path: RetainerUndercut/bin/Release/RetainerUndercut/latest.zip
          if-no-files-found: warn
